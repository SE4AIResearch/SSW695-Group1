name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  GODOT_VERSION: "4.6-stable"
  GODOT_DOWNLOAD_NAME: "Godot_v4.6-stable_linux.x86_64"
  GODOT_TEMPLATES_ARCHIVE: "Godot_v4.6-stable_export_templates.tpz"

jobs:
  validate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Godot
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin" "$HOME/.local/share/godot/export_templates/4.6.stable"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_DOWNLOAD_NAME}.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          install "/tmp/godot/${GODOT_DOWNLOAD_NAME}" "$HOME/bin/godot"
          chmod +x "$HOME/bin/godot"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_TEMPLATES_ARCHIVE}" -o /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.stable/"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Validate release configuration
        run: python3 scripts/ci/validate_release_config.py

      - name: Import project headlessly
        run: godot --headless --path . --import

      - name: Validate project opens cleanly
        run: godot --headless --path . --quit
